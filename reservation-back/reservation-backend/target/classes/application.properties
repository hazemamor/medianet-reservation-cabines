# --- JWT ---
app.jwt.secret=${JWT_SECRET:ZmFrZS1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS1tb2ktZW4tcHJvZHVjdGlvbi1zdnAtMjU2Yml0cw==}
app.jwt.expiration-ms=86400000

# --- OTP (authentification passwordless) ---
app.otp.validity-minutes=5
app.otp.max-attempts=5
app.otp.lock-minutes=15
app.otp.retention-hours=24
app.otp.purge-cron=0 0 3 * * *

# --- Duree de conservation de l'historique des reservations avant anonymisation ---
app.data-retention.historique-reservations-mois=24

# --- Reservation automatique / annulation ---
app.reservation.confirmation-window-minutes=15
app.reservation.scheduler-cron=0 */5 * * * *

# --- Microservice IA (FastAPI + Random Forest) ---
app.ia.base-url=${IA_SERVICE_URL:http://localhost:8000}
app.ia.activer-microservice=false

