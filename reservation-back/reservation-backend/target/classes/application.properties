spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Envoi des OTP par email ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hazemamor05@gmail.com
spring.mail.password=acprmhuvkvbudiig

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Contourne l'echec "PKIX path building failed" en faisant confiance explicitement
# a l'hote Gmail (plutot que de desactiver la validation TLS globalement)
